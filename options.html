<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快译 - 设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #888;
            margin-bottom: 32px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .icon {
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 14px;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            margin-left: 12px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .status.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }

        .status.info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #3b82f6;
        }

        .status.warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f59e0b;
        }

        .status.hidden {
            display: none;
        }

        .engine-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .engine-badge.deepl {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(124, 58, 237, 0.2));
            color: #00d4ff;
        }

        .engine-badge.google {
            background: rgba(255, 255, 255, 0.1);
            color: #888;
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }

        .hint a {
            color: #00d4ff;
            text-decoration: none;
        }

        .hint a:hover {
            text-decoration: underline;
        }

        .actions {
            display: flex;
            align-items: center;
            margin-top: 20px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 12px 24px;
            background: rgba(34, 197, 94, 0.9);
            color: white;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>⚡ 快译设置</h1>
        <p class="subtitle">配置翻译引擎和 API 密钥</p>

        <div class="card">
            <div class="card-title">
                <span class="icon">🌐</span>
                当前翻译引擎
            </div>
            <div id="currentEngine">
                <span class="engine-badge google">⏳ 检测中...</span>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <span class="icon">🔑</span>
                DeepL API 配置
            </div>

            <div id="statusMessage" class="status hidden"></div>

            <div class="form-group">
                <label for="apiKey">DeepL API 密钥</label>
                <input type="password" id="apiKey" placeholder="输入你的 DeepL API 密钥...">
                <p class="hint">
                    还没有密钥？<a href="https://www.deepl.com/pro-api" target="_blank">点击这里申请免费 API</a>
                </p>
            </div>

            <div class="actions">
                <button class="btn btn-primary" id="saveBtn">保存密钥</button>
                <button class="btn btn-secondary" id="clearBtn">清除密钥</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <span class="icon">📊</span>
                翻译引擎对比
            </div>
            <table style="width: 100%; font-size: 14px; border-collapse: collapse;">
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                    <th style="text-align: left; padding: 12px 0; color: #888;">特性</th>
                    <th style="text-align: center; padding: 12px 0; color: #00d4ff;">DeepL</th>
                    <th style="text-align: center; padding: 12px 0; color: #888;">Google</th>
                </tr>
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <td style="padding: 12px 0;">翻译质量</td>
                    <td style="text-align: center;">⭐⭐⭐⭐⭐</td>
                    <td style="text-align: center;">⭐⭐⭐</td>
                </tr>
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <td style="padding: 12px 0;">自然度</td>
                    <td style="text-align: center;">⭐⭐⭐⭐⭐</td>
                    <td style="text-align: center;">⭐⭐⭐</td>
                </tr>
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <td style="padding: 12px 0;">免费额度</td>
                    <td style="text-align: center;">50万字符/月</td>
                    <td style="text-align: center;">无限制</td>
                </tr>
                <tr>
                    <td style="padding: 12px 0;">需要 API 密钥</td>
                    <td style="text-align: center;">✅</td>
                    <td style="text-align: center;">❌</td>
                </tr>
            </table>
        </div>
    </div>

    <div class="toast" id="toast">✅ 设置已保存</div>

    <script src="options.js"></script>
</body>

</html>
