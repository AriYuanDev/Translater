<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translater PDF Reader</title>
    <link rel="stylesheet" href="viewer-toolbar.css">
    <link rel="stylesheet" href="pdfviewer.css">
    <script src="pdf.min.mjs" type="module"></script>
</head>

<body>
    <div class="pdf-toolbar">
        <div class="toolbar-left">
            <button id="sidebarToggle" class="toolbar-btn" title="Browse Sidebar">
                <svg viewBox="0 0 24 24">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                </svg>
            </button>
            <button id="prevPage" class="toolbar-btn" title="Previous Page">
                <svg viewBox="0 0 24 24">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                </svg>
            </button>
            <span class="page-info">
                <span id="currentPage" class="page-current">1</span>
                <span class="page-separator">/</span>
                <span id="totalPages">1</span>
            </span>
            <button id="nextPage" class="toolbar-btn" title="Next Page">
                <svg viewBox="0 0 24 24">
                    <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
                </svg>
            </button>
        </div>
        <div class="toolbar-center">
            <button id="zoomOut" class="toolbar-btn" title="Zoom Out">
                <svg viewBox="0 0 24 24">
                    <path d="M19 13H5v-2h14v2z" />
                </svg>
            </button>
            <span id="zoomLevel" class="zoom-level">100%</span>
            <button id="zoomIn" class="toolbar-btn" title="Zoom In">
                <svg viewBox="0 0 24 24">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
            </button>
            <button id="fitWidth" class="toolbar-btn" title="Fit Width">
                <svg viewBox="0 0 24 24">
                    <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z" />
                </svg>
            </button>
        </div>
        <div class="toolbar-right">
            <span id="pdfTitle" class="pdf-title">Loading...</span>
            <button id="downloadPdf" class="toolbar-btn" title="Download PDF">
                <svg viewBox="0 0 24 24">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-tabs">
            <button type="button" class="sidebar-tab active" data-sidebar-panel="files">Files</button>
            <button type="button" class="sidebar-tab" data-sidebar-panel="contents">Contents</button>
        </div>
        <div class="sidebar-panel active" data-panel="files">
            <div class="sidebar-panel-header">
                <div class="sidebar-panel-title">Files</div>
                <div id="sidebarFolderName" class="sidebar-panel-subtitle">Current Folder</div>
            </div>
            <div id="fileBrowserContainer" class="file-browser-container">
                <div class="sidebar-empty">Loading sibling documents...</div>
            </div>
        </div>
        <div class="sidebar-panel" data-panel="contents">
            <div class="sidebar-panel-header">
                <div class="sidebar-panel-title">Contents</div>
            </div>
            <div id="outlineContainer" class="outline-container">
                <div class="outline-empty">No contents available</div>
            </div>
        </div>
    </div>

    <div id="viewerContainer" class="viewer-container">
        <div id="viewer" class="pdf-viewer"></div>
    </div>

    <script type="module" src="pdfviewer.js"></script>
</body>

</html>
